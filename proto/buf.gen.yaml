version: v2
plugins:
  # ── Go ────────────────────────────────────────────────────────────────────
  - remote: buf.build/protocolbuffers/go
    out: ../server/gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../server/gen
    opt:
      - paths=source_relative
  # ── TypeScript (Connect-ES v2) ────────────────────────────────────────────
  # protoc-gen-es v2 emits the service descriptors Connect-ES v2 clients use,
  # so no separate Connect plugin is needed.
  - remote: buf.build/bufbuild/es
    out: ../frontend/src/gen
    opt:
      - target=ts
