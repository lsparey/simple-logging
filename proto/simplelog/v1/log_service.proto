syntax = "proto3";

package simplelog.v1;

option go_package = "github.com/lsparey/simple-logging/gen/simplelog/v1;simplelogv1";

// LogService exposes pod log data collected by simple-logging to frontend
// clients over gRPC-Web.
service LogService {
  // ListNamespaces returns all namespaces for which log files exist on disk.
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);

  // ListPods returns all pods within a namespace for which log files exist,
  // along with whether each pod is currently being streamed (active).
  rpc ListPods(ListPodsRequest) returns (ListPodsResponse);

  // GetLogs returns a paginated, optionally time-filtered page of log lines
  // for a specific pod.
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);

  // StreamLogs tails a pod's log file and streams new lines as they are
  // written. The stream stays open until the client cancels it.
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse);

  // ListDeployments returns all deployments (groups of pods sharing the same
  // deployment name) within a namespace for which log files exist.
  //
  // Deprecated: superseded by ListWorkloads (kind = "Deployment"). Kept as a
  // thin wrapper for one release before removal.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);

  // GetDeploymentLogs returns a paginated, optionally time-filtered page of
  // log lines merged from all pods belonging to a deployment, sorted by time.
  //
  // Deprecated: superseded by GetWorkloadLogs (kind = "Deployment"). Kept as
  // a thin wrapper for one release before removal.
  rpc GetDeploymentLogs(GetDeploymentLogsRequest) returns (GetDeploymentLogsResponse);

  // StreamDeploymentLogs tails all active pods for a deployment and streams
  // merged log lines in real time. The stream stays open until the client
  // cancels it.
  //
  // Deprecated: superseded by StreamWorkloadLogs (kind = "Deployment"). Kept
  // as a thin wrapper for one release before removal.
  rpc StreamDeploymentLogs(StreamDeploymentLogsRequest) returns (stream StreamDeploymentLogsResponse);

  // ListWorkloads returns every workload (a group of pods sharing the same
  // owner, resolved from each pod's ownerReferences) within a namespace:
  // Deployment, StatefulSet, DaemonSet, Job, CronJob, or bare Pod. A Job
  // created by a CronJob run is listed under both its own Job entry and its
  // CronJob's entry.
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);

  // GetWorkloadLogs returns a paginated, optionally time-filtered page of log
  // lines merged from every pod and container belonging to a workload,
  // sorted by time.
  rpc GetWorkloadLogs(GetWorkloadLogsRequest) returns (GetWorkloadLogsResponse);

  // StreamWorkloadLogs tails all active pods for a workload and streams
  // merged log lines in real time. The stream stays open until the client
  // cancels it.
  rpc StreamWorkloadLogs(StreamWorkloadLogsRequest) returns (stream StreamWorkloadLogsResponse);

  // ListLogFiles returns every persisted pod log and index file with metadata.
  rpc ListLogFiles(ListLogFilesRequest) returns (ListLogFilesResponse);

  // ListIndexes returns all JSON log indexes configured on disk.
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse);

  // CreateIndex creates a JSON key index and backfills it from existing pod logs.
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse);

  // DeleteIndex removes a JSON key index and its persisted value files.
  rpc DeleteIndex(DeleteIndexRequest) returns (DeleteIndexResponse);

  // ListIndexValues returns observed values ordered by most recent match.
  rpc ListIndexValues(ListIndexValuesRequest) returns (ListIndexValuesResponse);

  // GetIndexLogs returns log lines whose indexed JSON key matches the value.
  rpc GetIndexLogs(GetIndexLogsRequest) returns (GetIndexLogsResponse);

  // SearchLogs streams log lines matching a substring or regex query across
  // one or more pods/containers, optionally scoped by namespace, workload, or
  // time range, and bounded by max_results.
  rpc SearchLogs(SearchLogsRequest) returns (stream SearchLogsResponse);
}

// ── ListNamespaces ────────────────────────────────────────────────────────────

message ListNamespacesRequest {}

message ListNamespacesResponse {
  repeated string namespaces = 1;
}

// ── ListPods ──────────────────────────────────────────────────────────────────

message ListPodsRequest {
  // namespace is required; use "*" is not supported — call ListNamespaces first.
  string namespace = 1;
}

message PodInfo {
  string name      = 1;
  string namespace = 2;
  // active is true when the pod is currently running and logs are being streamed.
  bool active = 3;
  // json_logging is true when the pod's log output appears to use JSON formatting.
  bool json_logging = 4;
  // containers lists the names of containers with persisted logs for this
  // pod. Every pod has collected exactly one container to date; this is
  // forward-compatible groundwork for multi-container collection.
  repeated string containers = 5;
}

message ListPodsResponse {
  repeated PodInfo pods = 1;
}

// ── GetLogs ───────────────────────────────────────────────────────────────────

message GetLogsRequest {
  string namespace = 1;
  string pod       = 2;

  // start_time and end_time are Unix timestamps (seconds).
  // A value of 0 means no bound on that side.
  int64 start_time = 3;
  int64 end_time   = 4;

  // page_size is the maximum number of log lines to return.
  // Defaults to 200 if unset or 0; capped at a server-defined maximum.
  int32 page_size = 5;

  // page_token is an opaque cursor returned by a previous GetLogs call.
  // Leave empty to start from the beginning (or the earliest line matching
  // the time filter).
  string page_token = 6;

  // load_last_page, when true, returns the last page of logs (most recent
  // lines) regardless of page_token. Use prev_page_token from the response
  // to page backwards through older logs.
  bool load_last_page = 7;
}

message GetLogsResponse {
  repeated string lines = 1;

  // next_page_token is the cursor to pass in the next request.
  // An empty value means this is the last page.
  string next_page_token = 2;

  // prev_page_token is the cursor to pass to load the page of older logs
  // that precedes this one. Empty when already at the beginning.
  string prev_page_token = 3;
}

// ── StreamLogs ────────────────────────────────────────────────────────────────

message StreamLogsRequest {
  string namespace = 1;
  string pod       = 2;
}

message StreamLogsResponse {
  string line = 1;
}

// ── ListDeployments ───────────────────────────────────────────────────────────

message ListDeploymentsRequest {
  string namespace = 1;
}

message DeploymentInfo {
  string name      = 1;
  string namespace = 2;
  // active is true when at least one pod in the deployment is currently running.
  bool active = 3;
  // json_logging is true when at least one pod in the deployment uses JSON log formatting.
  bool json_logging = 4;
}

message ListDeploymentsResponse {
  repeated DeploymentInfo deployments = 1;
}

// ── GetDeploymentLogs ─────────────────────────────────────────────────────────

message GetDeploymentLogsRequest {
  string namespace   = 1;
  string deployment  = 2;

  // start_time and end_time are Unix timestamps (seconds).
  // A value of 0 means no bound on that side.
  int64 start_time = 3;
  int64 end_time   = 4;

  // page_size is the maximum number of log lines to return.
  // Defaults to 200 if unset or 0; capped at a server-defined maximum.
  int32 page_size = 5;

  // page_token is an opaque cursor returned by a previous GetDeploymentLogs call.
  // Leave empty to start from the beginning.
  string page_token = 6;

  // load_last_page, when true, returns the last page of logs (most recent
  // lines) regardless of page_token. Use prev_page_token from the response
  // to page backwards through older logs.
  bool load_last_page = 7;
}

message GetDeploymentLogsResponse {
  repeated string lines = 1;

  // next_page_token is the cursor to pass in the next request.
  // An empty value means this is the last page.
  string next_page_token = 2;

  // prev_page_token is the cursor to pass to load the page of older logs
  // that precedes this one. Empty when already at the beginning.
  string prev_page_token = 3;
}

// ── StreamDeploymentLogs ──────────────────────────────────────────────────────

message StreamDeploymentLogsRequest {
  string namespace  = 1;
  string deployment = 2;
}

message StreamDeploymentLogsResponse {
  string line = 1;
}

// ── ListWorkloads ────────────────────────────────────────────────────────────

message ListWorkloadsRequest {
  string namespace = 1;
}

message WorkloadInfo {
  // kind is one of "Deployment", "StatefulSet", "DaemonSet", "Job",
  // "CronJob", or "Pod" (an unowned bare pod, listed as its own workload).
  string kind      = 1;
  string name      = 2;
  string namespace = 3;
  // active is true when at least one pod in the workload is currently running.
  bool active = 4;
  // json_logging is true when at least one pod in the workload uses JSON log formatting.
  bool json_logging = 5;
  // pods lists the names of pods currently grouped under this workload, so
  // clients can filter a workload's merged log view down to one pod (or,
  // combined with ListPods, down to one container) without a second call.
  repeated string pods = 6;
}

message ListWorkloadsResponse {
  repeated WorkloadInfo workloads = 1;
}

// ── GetWorkloadLogs ───────────────────────────────────────────────────────────

message GetWorkloadLogsRequest {
  string namespace = 1;
  string kind      = 2;
  string name      = 3;

  // start_time and end_time are Unix timestamps (seconds).
  // A value of 0 means no bound on that side.
  int64 start_time = 4;
  int64 end_time   = 5;

  // page_size is the maximum number of log lines to return.
  // Defaults to 200 if unset or 0; capped at a server-defined maximum.
  int32 page_size = 6;

  // page_token is an opaque cursor returned by a previous GetWorkloadLogs call.
  // Leave empty to start from the beginning.
  string page_token = 7;

  // load_last_page, when true, returns the last page of logs (most recent
  // lines) regardless of page_token. Use prev_page_token from the response
  // to page backwards through older logs.
  bool load_last_page = 8;
}

message GetWorkloadLogsResponse {
  repeated string lines = 1;

  // next_page_token is the cursor to pass in the next request.
  // An empty value means this is the last page.
  string next_page_token = 2;

  // prev_page_token is the cursor to pass to load the page of older logs
  // that precedes this one. Empty when already at the beginning.
  string prev_page_token = 3;
}

// ── StreamWorkloadLogs ─────────────────────────────────────────────────────────

message StreamWorkloadLogsRequest {
  string namespace = 1;
  string kind      = 2;
  string name      = 3;
}

message StreamWorkloadLogsResponse {
  string line = 1;
}

// ── Log files ────────────────────────────────────────────────────────────────

message ListLogFilesRequest {}

message LogFileInfo {
  string namespace = 1;
  string name = 2;
  int64 size_bytes = 3;
  string kind = 4;
  int64 modified_at_unix_ms = 5;
  string subject = 6;
}

message ListLogFilesResponse {
  // Only the largest files are returned (see server-side limit); use the
  // counts below for accurate totals across all persisted files.
  repeated LogFileInfo files = 1;
  int64 total_size_bytes = 2;
  int32 total_log_file_count = 3;
  int32 total_index_file_count = 4;

  // disk_used_percent is the current percentage of the log storage volume in
  // use. disk_high_water_percent and disk_low_water_percent are the
  // configured thresholds at which the disk guard starts, and stops,
  // deleting the oldest log segments (see config.diskHighWaterPercent /
  // config.diskLowWaterPercent in the Helm chart).
  int32 disk_used_percent = 5;
  int32 disk_high_water_percent = 6;
  int32 disk_low_water_percent = 7;
}

// ── Indexes ──────────────────────────────────────────────────────────────────

message ListIndexesRequest {}

message LogIndexInfo {
  string key = 1;
}

message ListIndexesResponse {
  repeated LogIndexInfo indexes = 1;
}

message CreateIndexRequest {
  string key = 1;
}

message CreateIndexResponse {
  LogIndexInfo index = 1;
}

message DeleteIndexRequest {
  string key = 1;
}

message DeleteIndexResponse {}

message ListIndexValuesRequest {
  string key = 1;
  // page_size is the maximum number of index values to return.
  // Defaults to 50 if unset or 0; capped at a server-defined maximum.
  int32 page_size = 2;
  // page_token is an opaque cursor returned by a previous ListIndexValues call.
  string page_token = 3;
}

message LogIndexValueInfo {
  string value = 1;
  int64 count = 2;
  int64 last_updated_unix_ms = 3;
}

message ListIndexValuesResponse {
  repeated LogIndexValueInfo values = 1;
  string next_page_token = 2;
  string prev_page_token = 3;
}

message GetIndexLogsRequest {
  string key = 1;
  string value = 2;

  // page_size is the maximum number of log lines to return.
  // Defaults to 200 if unset or 0; capped at a server-defined maximum.
  int32 page_size = 3;

  // page_token is an opaque cursor returned by a previous GetIndexLogs call.
  string page_token = 4;

  // load_last_page, when true, returns the last page of matching logs.
  bool load_last_page = 5;
}

message GetIndexLogsResponse {
  repeated string lines = 1;
  string next_page_token = 2;
  string prev_page_token = 3;
}

// ── SearchLogs ───────────────────────────────────────────────────────────────

message SearchLogsRequest {
  // namespace scopes the search to one namespace; "" searches every namespace.
  string namespace = 1;

  // workload_kind/workload_name scope the search to one workload's pods.
  // Leave both empty to not scope by workload.
  string workload_kind = 2;
  string workload_name = 3;

  // pod scopes the search to one pod. Ignored if workload_kind/workload_name
  // are set.
  string pod = 4;

  // container scopes the search to one container name within the selected
  // pod(s). "" searches every container.
  string container = 5;

  // query is the text to search for: a case-insensitive substring match, or
  // an RE2 pattern when regex is true.
  string query = 6;
  bool regex = 7;

  // start_time_unix_ms and end_time_unix_ms bound the search by log line
  // timestamp. 0 means unbounded on that side.
  int64 start_time_unix_ms = 8;
  int64 end_time_unix_ms = 9;

  // max_results caps the number of matches returned. Defaults to 1000 if
  // unset or 0; capped at a server-defined maximum.
  int32 max_results = 10;

  // newest_first prioritizes scanning the most recent log segments first, so
  // that when max_results truncates the search, the returned matches are the
  // most recent ones rather than the oldest.
  bool newest_first = 11;
}

message SearchLogsResponse {
  string line = 1;
  string namespace = 2;
  string pod = 3;
  string container = 4;

  // truncated is set on the final message when max_results was reached
  // before every matching file was scanned.
  bool truncated = 5;
}
