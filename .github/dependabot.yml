# Weekly dependency updates, grouped so each ecosystem opens at most one PR
# for minor/patch bumps. Major bumps still arrive individually.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 (the native compiler)
      # yet. Drop this once its typescript peer range allows 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # Base images in the Dockerfile (node, golang, distroless).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
    ignore:
      # Only even-numbered Node majors become LTS; skip the odd ones.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]
