name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Release notes (optional; commit messages are used when blank)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # chart-releaser needs full git history
          token: ${{ secrets.ADMIN_BYPASS_TOKEN }}  # Pass the admin token here so the git operations inherit the Admin bypass role

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current="$(sed -n 's/^version: *//p' deploy/helm/simple-logging/Chart.yaml)"
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Chart version is not valid SemVer: $current" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          case "$BUMP" in
            patch) ((patch += 1)) ;;
            minor) ((minor += 1)); patch=0 ;;
            major) ((major += 1)); minor=0; patch=0 ;;
            *) echo "Unknown version bump: $BUMP" >&2; exit 1 ;;
          esac

          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major.$minor" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          notes_file="deploy/helm/simple-logging/RELEASE_NOTES.md"
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          else
            previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            if [[ -n "$previous_tag" ]]; then
              range="$previous_tag..HEAD"
            else
              range="HEAD"
            fi

            {
              echo "## Changes"
              echo
              git log --no-merges --format='- %s (`%h`)' "$range"
            } > "$notes_file"
          fi

      - name: Update Chart.yaml
        run: |
          sed -i "s/^version:.*/version: ${{ steps.ver.outputs.version }}/" deploy/helm/simple-logging/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.ver.outputs.version }}\"/" deploy/helm/simple-logging/Chart.yaml

      - name: Commit and tag
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add deploy/helm/simple-logging/Chart.yaml
          git commit -m "chore: release v${{ steps.ver.outputs.version }}"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            lsparey/simple-logging:${{ steps.ver.outputs.version }}
            lsparey/simple-logging:${{ steps.ver.outputs.major_minor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create gh-pages branch if it does not exist
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git switch --orphan gh-pages
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout "v${{ steps.ver.outputs.version }}"
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: deploy/helm
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_RELEASE_NOTES_FILE: RELEASE_NOTES.md
