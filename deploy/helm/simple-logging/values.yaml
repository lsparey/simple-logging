nameOverride: ""
fullnameOverride: ""

image:
  repository: lsparey/simple-logging
  # Defaults to Chart.appVersion so each chart release deploys its matching,
  # immutable image. Override only to test a specific image tag.
  tag: ""
  pullPolicy: IfNotPresent

ingress:
  enabled: false
  className: ""
  annotations: {}
  # host: logging.example.com
  host: ""
  tls: []

# Application configuration — all values map 1:1 to environment variables.
config:
  logsRoot: /var/pod-logs
  # The one container port serving the UI, the API, /healthz and /readyz.
  port: 8080
  retentionDays: 30
  retentionCheckInterval: "24h"
  # Safety net for when retention alone doesn't keep PVC usage down: at or
  # above diskHighWaterPercent, the oldest log segments (across every
  # namespace/pod) are deleted until usage drops back below
  # diskLowWaterPercent. Should rarely trigger in normal operation.
  diskHighWaterPercent: 90
  diskLowWaterPercent: 80
  logLevel: info
  # logCollectionMode controls how pod logs are collected.
  #
  #   hybrid (default) — pods scheduled on the same node as simple-logging
  #     are tailed directly from the node filesystem via a hostPath volume;
  #     pods on every other node are streamed through the Kubernetes log
  #     API. A single replica covers a multi-node cluster while limiting
  #     API/kubelet load to the remote pods only. On a single-node cluster
  #     this behaves exactly like fileTail. Requires nodeLogsRoot.
  #
  #   fileTail — tail log files directly from the node filesystem via a
  #     hostPath volume. Bypasses the Kubernetes log API entirely (no
  #     persistent connections through kube-apiserver/kubelet/containerd).
  #     Single-node clusters only: pods on other nodes are not collected.
  #     Requires nodeLogsRoot to be set to the host path where the runtime
  #     writes pod log files.
  #
  #   api — stream logs via the Kubernetes log API (one persistent HTTP
  #     connection per pod). Works on any cluster topology without any host
  #     filesystem access. Can cause elevated containerd/kubelet CPU on busy
  #     clusters; prefer hybrid unless hostPath volumes are not permitted.
  #
  logCollectionMode: hybrid

  # Path where the runtime writes pod log files on the host node.
  # Only used when logCollectionMode is "hybrid" or "fileTail".
  # Standard value for containerd and Docker: /var/log/pods
  nodeLogsRoot: /var/log/pods

  # Path where Docker writes the actual log file content on the host.
  # Only needed when logCollectionMode is "hybrid" or "fileTail" AND the runtime is
  # Docker (e.g. Docker Desktop) — /var/log/pods entries are symlinks into
  # this directory, so it must also be mounted for the symlinks to resolve.
  # Leave empty for containerd clusters.
  dockerLogsRoot: /var/lib/docker/containers

# Persistent storage for log files.
persistence:
  enabled: true
  # Use an existing PVC instead of creating one when set.
  existingClaim: ""
  # Versioned to start with an empty store when upgrading from the legacy chart.
  claimSuffix: logs-v3
  # storageClass: "" uses the cluster default. Set to a specific class if needed.
  storageClass: ""
  size: 20Gi
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  # Serves the UI and the API (gRPC, gRPC-Web and Connect) on one port.
  port: 80

# Browser origins allowed to call the API cross-origin. Leave empty (CORS
# off) when the UI is served by this chart, which is the normal setup; set it
# only if you host the frontend build somewhere else.
cors:
  allowedOrigins: []

resources:
  requests:
    cpu: 150m
    memory: 160Mi
  limits:
    cpu: 700m
    memory: 576Mi

# Pod-level security context. The image runs as the distroless "nonroot"
# user (UID/GID 65532); fsGroup makes the log PVC writable by it.
#
# In hybrid and fileTail modes the chart also adds supplemental group 0: the
# CRI writes /var/log/pods as root:root 0750 with 0640 log files, so group 0
# is what lets the non-root user read them. No root UID or capabilities are
# needed on containerd or CRI-O.
#
# hybrid/fileTail on Docker (e.g. Docker Desktop): /var/lib/docker/containers
# is readable by root only, so set podSecurityContext.runAsUser=0 and
# securityContext.runAsNonRoot=false there. api mode never needs host access.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Runs a root init container that chowns the log PVC to runAsUser before the
# app starts. Only needed when upgrading from chart 0.13.x or older (whose image ran
# as root, so existing log files are root-owned) on a storage class that
# ignores fsGroup, such as local-path or other hostPath-backed provisioners.
# Enable for the upgrade, then it can be turned off again.
volumePermissions:
  enabled: false
  image: busybox:1.37

# Container-level security context.
securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Optional NetworkPolicy. When enabled, ingress is only allowed from the
# ingress controller's namespace, and egress only to DNS and the Kubernetes
# API server (which also proxies log streams from kubelets in api/hybrid
# mode, so kubelets never need to be reachable directly).
networkPolicy:
  enabled: false
  # Namespace the ingress controller runs in. Its pods may reach the app.
  ingressNamespace: ingress-nginx
  # Additional ingress peers, e.g. a monitoring namespace or a namespace you
  # port-forward from (list of NetworkPolicyPeer).
  extraIngressFrom: []
  # API server addresses for egress. Empty allows the API server ports to
  # any address. Both the Service port (443) and the usual endpoint port
  # (6443) are listed because CNIs differ in which one the policy sees.
  apiServerCIDRs: []
  apiServerPorts: [443, 6443]

# Scheduling controls, all empty/disabled by default.
nodeSelector: {}
affinity: {}
tolerations: []
priorityClassName: ""

# Extra annotations to apply to the pod template.
podAnnotations: {}

# Extra volumes and mounts, e.g. for mounting a custom cert or config file.
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  # Set to false to use an existing service account.
  create: true
  # Leave blank to default to the chart fullname.
  name: ""

# RBAC — creates a ClusterRole + ClusterRoleBinding so the app can read pod logs
# across all namespaces. Disable if you manage RBAC externally.
rbac:
  create: true

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Extra environment variables to inject into the container.
# e.g. extraEnv:
#   - name: PPROF_PORT
#     value: "6060"
extraEnv: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
