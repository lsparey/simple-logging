{{- $mode := .Values.config.logCollectionMode }}
{{- if not (has $mode (list "hybrid" "fileTail" "api")) }}
{{- fail (printf "config.logCollectionMode must be one of hybrid, fileTail or api (got %q)" $mode) }}
{{- end }}
{{- /* hybrid and fileTail both read pod logs from the node filesystem. */}}
{{- $hostLogs := or (eq $mode "hybrid") (eq $mode "fileTail") }}
{{- include "simple-logging.failOnRemovedValues" . }}
{{- if and .Values.auth.basic.enabled (not .Values.auth.basic.existingSecret) }}
{{- fail "auth.basic.enabled needs auth.basic.existingSecret: the name of a Secret holding an htpasswd file (see values.yaml)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simple-logging.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "simple-logging.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The app is a hardcoded singleton (replicas: 1 above) and the default PVC
  # is ReadWriteOnce, so RollingUpdate can strand the new pod in
  # FailedAttachVolume when it lands on a different node than the old one on
  # multi-node clusters. Recreate guarantees the old pod fully terminates
  # (and releases the volume) before the new one is created.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "simple-logging.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "simple-logging.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "simple-logging.serviceAccountName" . }}
      {{- $podSecurityContext := deepCopy .Values.podSecurityContext }}
      {{- if $hostLogs }}
      {{- /* The CRI writes /var/log/pods as root:root 0750 with 0640 log files,
      so a non-root UID can only read them as a member of group 0. */}}
      {{- $groups := concat ($podSecurityContext.supplementalGroups | default list) (list 0) | uniq }}
      {{- $_ := set $podSecurityContext "supplementalGroups" $groups }}
      {{- end }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        - name: volume-permissions
          image: {{ .Values.volumePermissions.image | quote }}
          command:
            - chown
            - -R
            - {{ printf "%v:%v" .Values.podSecurityContext.runAsUser (.Values.podSecurityContext.runAsGroup | default .Values.podSecurityContext.runAsUser) | quote }}
            - {{ .Values.config.logsRoot | quote }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          volumeMounts:
            - name: logs
              mountPath: {{ .Values.config.logsRoot }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            - name: LOGS_ROOT
              value: {{ .Values.config.logsRoot | quote }}
            - name: PORT
              value: {{ .Values.config.port | quote }}
            {{- with .Values.cors.allowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: RETENTION_DAYS
              value: {{ .Values.config.retentionDays | quote }}
            - name: RETENTION_CHECK_INTERVAL
              value: {{ .Values.config.retentionCheckInterval | quote }}
            - name: DISK_HIGH_WATER_PERCENT
              value: {{ .Values.config.diskHighWaterPercent | quote }}
            - name: DISK_LOW_WATER_PERCENT
              value: {{ .Values.config.diskLowWaterPercent | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.auth.basic.enabled }}
            - name: AUTH_HTPASSWD_FILE
              value: /etc/simple-logging/auth/htpasswd
            {{- end }}
            {{- if $hostLogs }}
            - name: NODE_LOGS_ROOT
              value: {{ .Values.config.nodeLogsRoot | quote }}
            {{- end }}
            {{- if eq $mode "hybrid" }}
            # Tells the collector whose node's log files are mounted, so pods on
            # other nodes fall back to the Kubernetes log API.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: logs
              mountPath: {{ .Values.config.logsRoot }}
            {{- if $hostLogs }}
            - name: node-logs
              mountPath: {{ .Values.config.nodeLogsRoot }}
              readOnly: true
            {{- if .Values.config.dockerLogsRoot }}
            - name: docker-logs
              mountPath: {{ .Values.config.dockerLogsRoot }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.auth.basic.enabled }}
            - name: htpasswd
              mountPath: /etc/simple-logging/auth
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: logs
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "simple-logging.persistenceClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $hostLogs }}
        - name: node-logs
          hostPath:
            path: {{ .Values.config.nodeLogsRoot }}
            type: DirectoryOrCreate
        {{- if .Values.config.dockerLogsRoot }}
        - name: docker-logs
          hostPath:
            path: {{ .Values.config.dockerLogsRoot }}
            type: DirectoryOrCreate
        {{- end }}
        {{- end }}
        {{- if .Values.auth.basic.enabled }}
        - name: htpasswd
          secret:
            secretName: {{ .Values.auth.basic.existingSecret }}
            items:
              - key: {{ .Values.auth.basic.secretKey }}
                path: htpasswd
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
